<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBOLAGADE's MiniMart - Sign Up</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <div class="page-shell">
    <header class="auth-header">
      <a class="brand" href="landing_page.html">GBOLAGADE's MiniMart</a>
      <p>Create your account and start ordering groceries with fast delivery.</p>
    </header>

    <main>
      <form action="#" method="POST" class="auth-form" novalidate>
        <div class="form-row">
          <div class="form-field">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="firstName" required autocomplete="given-name" placeholder="First name">
          </div>
          <div class="form-field">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="lastName" required autocomplete="family-name" placeholder="Last name">
          </div>
        </div>

        <div class="form-field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>

        <div class="form-field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="0801 234 5678" autocomplete="tel">
        </div>

        <div class="form-field">
          <label for="address">Home Address</label>
          <input type="text" id="address" name="address" required autocomplete="street-address" placeholder="Enter your delivery address">
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" required autocomplete="new-password" placeholder="Create a password">
          </div>
          <div class="form-field">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirmPassword" required autocomplete="new-password" placeholder="Confirm password">
          </div>
        </div>

        <button type="submit" class="primary-button">Create Account</button>
      </form>

      <p class="switch-action">Already have an account? <a href="login.html">Log in here</a>.</p>
    </main>
  </div>
</body>
</html>
